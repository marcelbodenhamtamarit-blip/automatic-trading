name: Paper Trading Diario

# Corre de lunes a viernes a las 22:00 UTC (despues del cierre del mercado
# de EEUU, cuando la vela diaria ya es definitiva).
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

# Necesario para que el robot pueda auto-confirmar su estado al repositorio
permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      - name: Correr el paper trader
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_trader.py

      - name: Guardar el estado actualizado
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json trades_paper.csv
          # Solo confirma si hubo cambios (evita commits vacios)
          git diff --staged --quiet || git commit -m "Estado paper trading $(date -u +%Y-%m-%d)"
          git push
